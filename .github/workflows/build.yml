name: Build

# Owner's rule: until the first public release (1.0.0), CI runs only on request. Start it from the Actions tab
# (Build > Run workflow) or with
#   gh workflow run build.yml --ref <branch>
# From the first public release on, CI is never skipped: add the `push` (branch `main`) and `pull_request` triggers
# in the release commit and stop writing `[skip ci]` (docs/VERSIONING.md, "Release checklist").
on:
  workflow_dispatch:

# Least privilege: the jobs only read the repository. No job may ask for more without a comment that says why.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned by its full commit SHA, with the version in a comment (docs/ENGINEERING_RULES.md, rule 4).
# Dependabot (.github/dependabot.yml) proposes the updates.

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Actions are pinned by commit SHA
        run: |
          if grep -nE '^\s*(-\s*)?uses:\s*[^#[:space:]]+@' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "Pin every action by its full commit SHA and name the version in a comment."
            exit 1
          fi

      - name: Markdown links and anchors
        run: python3 tools/docs/check_links.py

      - name: Tests of the repository tools
        run: |
          python3 -m unittest discover -s tools/docs
          sh tools/hooks/test-commit-msg.sh
          if [ -d tools/coverage ]; then python3 -m unittest discover -s tools/coverage; fi

      - name: No disabled tests
        run: |
          if grep -rnE '@Ignore|@Disabled' app/src/test; then
            echo "Disabled tests are not allowed (docs/ENGINEERING_RULES.md, rule T5)."
            exit 1
          fi

      - name: Verify tracked binaries against their checksums
        run: |
          if [ -f tools/verify-binaries.sh ]; then
            sh tools/verify-binaries.sh
          else
            echo "tools/verify-binaries.sh is not in this tree: skipped"
          fi

  app:
    name: Tests, lint, debug and release build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Coverage floors
        run: |
          if [ -f tools/coverage/check_coverage.py ]; then
            ./gradlew --no-daemon :app:jacocoDebugUnitTestReport
            python3 tools/coverage/check_coverage.py
          else
            echo "tools/coverage/check_coverage.py is not in this tree: skipped"
          fi

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APKs
        # The Android Gradle plugin downloads the NDK version pinned in app/build.gradle
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APKs (unsigned)
        # Not for distribution: no signing key is used here. This step proves that the minified release variant builds.
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delos-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/*armeabi-v7a*.apk
          retention-days: 1

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delos-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 3
