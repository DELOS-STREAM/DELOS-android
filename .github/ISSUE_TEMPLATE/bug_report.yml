# FIELD-ID CONTRACT (docs/DIAGNOSTICS.md, "Field-id contract of the issue forms")
#
# Delos builds whose IssueUrl.TEMPLATE is "bug_report.yml" open THIS form from "Report this problem" and fill it in
# through query parameters named after the field ids. Frozen for that reason:
#
#   file name    bug_report.yml
#   field ids    what-happened, area, device, build, stream-settings, logs
#   area options "Other" and "Pairing/connection"
#
# Never rename or remove them. The form made for the app is app_report.yml (same ids).
name: Bug report
description: Something in Delos does not work as expected
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Delos is in active development and the first release is recent, so rough edges are expected.

        If the problem is on the PC side (capture, encoder, host settings), please report it to Vibepollo, Apollo or Sunshine instead.

        Security problem? Do not file it here: use [Report a vulnerability](https://github.com/DELOS-STREAM/DELOS-android/security/advisories/new).

        Came here from **Report this problem** in Delos? The form is filled in for you. Check it, add what you were doing, and attach the diagnostic file Delos saved to your Downloads folder (drag it into the "What happened?" box; the log box at the end cannot take files).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find this one.
          required: true
        - label: I removed IP addresses, PC and account names and anything else private from the text and screenshots.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Leave empty when it happened once and you cannot repeat it.
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Always
        - Often
        - Sometimes
        - Once so far
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Stream video
        - Stream input/controller
        - Audio
        - Settings/UI
        - Library/artwork/metadata
        - Pairing/connection
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Device model, Android version"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host software
      options:
        - Vibepollo
        - Apollo
        - Sunshine
        - Other
        - Not a stream problem
  - type: input
    id: host-version
    attributes:
      label: Host version and operating system
      placeholder: "e.g. Vibepollo 2.0.1 on Windows 11"
  - type: input
    id: gpu
    attributes:
      label: PC GPU
      placeholder: "GPU model"
  - type: input
    id: stream-settings
    attributes:
      label: Stream settings (if streaming)
      description: Codec, resolution, frame rate, HDR on or off, upscaler mode.
      placeholder: "e.g. HEVC, 1920x1080, 60 fps, HDR off, Sharpen"
  - type: input
    id: build
    attributes:
      label: Delos build
      description: Commit or version, shown on the About page in Delos.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Helpful but optional. In Delos, Settings > About > Debug info shares a cleaned diagnostic log (addresses and names removed) or copies a short summary.

        With a debug build you can also run this right after the problem happens:

        `adb logcat -d -s DelosPyroDiag DelosSharpen DelosLatency DelosLinkTest DelosThreads`

        For stream problems, also attach a screenshot of the "Full" statistics panel. Remove IP addresses, names and other personal data first.
      render: text
