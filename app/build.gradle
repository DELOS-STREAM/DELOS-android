apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The metadata Worker's base URL (non-secret) comes from the environment or the ignored local.properties.
def metadataProperties = new Properties()
def metadataLocalFile = rootProject.file('local.properties')
if (metadataLocalFile.exists()) {
    metadataLocalFile.withInputStream { metadataProperties.load(it) }
}
def metadataSetting = { String name ->
    // A defined-but-empty environment variable must not hide the value in local.properties.
    def fromEnvironment = System.getenv(name)
    def value = fromEnvironment?.trim() ? fromEnvironment.trim() : metadataProperties.getProperty(name, '').trim()
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '\\r').replace('\n', '\\n') + '"'
}

android {
    ndkVersion = "29.0.14206865"

    compileSdk = 37

    namespace = 'com.limelight'

    defaultConfig {
        applicationId "io.github.meitoncz.delos"
        // Delos targets Android handhelds, which all run Android 10+
        minSdk 29
        targetSdk 36

        // Delos versioning: semantic version MAJOR.MINOR.PATCH, see docs/VERSIONING.md;
        // versionCode = MAJOR*10000 + MINOR*100 + PATCH (0.14.0 is 1400)
        // (based on Artemis 20.2.6)
        def versionMajor = 1
        def versionMinor = 0
        def versionPatch = 0
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        versionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

        // Full native debug symbols, so a native crash trace can be symbolicated
        ndk.debugSymbolLevel = 'FULL'

        // Empty by default (CI builds): game metadata is then reported as unavailable.
        buildConfigField 'String', 'DELOS_METADATA_URL', metadataSetting('DELOS_METADATA_URL')
        // The Delos report service's base URL (non-secret). Empty by default: "Report this problem" then only saves the log to
        // Downloads, as before the service existed (docs/DIAGNOSTICS.md).
        buildConfigField 'String', 'DELOS_REPORTS_URL', metadataSetting('DELOS_REPORTS_URL')
    }

    buildFeatures {
        buildConfig = true
        resValues = true
        // New native UI (Phase 6)
        compose = true
    }


    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    lint {
        // English is the fallback while languages are being filled in (docs/LOCALIZATION.md); StringResourcesTest enforces
        // keys, placeholders, plurals and the Delos rules of every translation file that exists. ExtraTranslation, MissingQuantity and
        // StringFormat* stay at their default (error) severity.
        disable 'MissingTranslation'
        lintConfig = file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Delos Debug"
        }
        release {
            // The applicationId is set in defaultConfig above, so release builds need no suffix.
            // No signingConfig on purpose: the release APK is built unsigned and signed outside the repository.
            resValue "string", "app_label", "Delos"

            // R8 with resource shrinking; the keep rules for reflection (Gson) and JNI are in proguard-rules.pro
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Native shell (docs/GUI.md): Compose foundation only, no Material components -
    // Delos has its own design system
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Backdrop blur for overlays (Android 12+, dimmed fallback below)
    implementation 'dev.chrisbanes.haze:haze-blur:2.0.1'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}

// ==== BEGIN unit-test coverage (JaCoCo) ====
// `./gradlew :app:jacocoDebugUnitTestReport` runs the debug unit tests and writes
// app/build/reports/jacoco/jacocoDebugUnitTestReport/{jacocoDebugUnitTestReport.xml,html/index.html}.
// `python3 tools/coverage/check_coverage.py` compares that XML with tools/coverage/baseline.json.
apply plugin: 'jacoco'
jacoco { toolVersion = '0.8.13' }
android.buildTypes.debug.enableUnitTestCoverage = true
tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true   // Robolectric loads classes through its own class loader
    jacoco.excludes = ['jdk.internal.*']
    // Robolectric needs this JDK-internal package to run tests on the API 36 image (targetSdk).
    jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
    // Keep the log readable: a failure must not drown in passed-test lines and logcat echoes.
    // Full output of every test stays in app/build/reports/tests and app/build/test-results.
    testLogging {
        events = ['failed', 'skipped']
        showStandardStreams = false
    }
}
tasks.register('jacocoDebugUnitTestReport', JacocoReport) {
    group = 'verification'
    description = 'Unit-test coverage of the debug variant (XML + HTML).'
    dependsOn 'testDebugUnitTest'
    def excludes = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/ComposableSingletons*']
    // Exact directories only: a wider file tree makes Gradle see outputs of unrelated tasks as inputs.
    classDirectories.setFrom(files(
        fileTree(dir: layout.buildDirectory.dir('intermediates/javac/debug'), excludes: excludes),
        fileTree(dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug'), excludes: excludes)))
    sourceDirectories.setFrom(files('src/main/java', 'src/debug/java'))
    executionData.setFrom(layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'))
    reports { xml.required = true; html.required = true; csv.required = false }
}
// ==== END unit-test coverage (JaCoCo) ====
